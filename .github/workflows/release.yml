# SPDX-License-Identifier: MIT
#
# Each push to main or beta makes a release on GitHub, with the source, an Arch
# Linux package, a Debian 13 package, a Windows installer and zip, and the
# changes since the last one.
# Main releases the version in CMakeLists.txt as the latest release, once. Beta
# releases it as a pre-release, v0.1.0-beta.1 and on, until that version is
# out. The source comes first, then CI's build of each platform, which tests
# it and makes its package, then the release, each once the stages before it
# have passed. Pull requests that change how they're made build the packages
# too, without releasing anything.
name: Release

on:
  push:
    branches: [main, beta]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/workflows/ci.yml
      - .github/scripts/**
      - packaging/**

permissions:
  contents: read

# One at a time, so two betas can't take the same number. A pull request only
# needs its latest push.
concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source:
    name: Source
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      release: ${{ steps.version.outputs.release }}
      arch-version: ${{ steps.version.outputs.arch-version }}
      debian-version: ${{ steps.version.outputs.debian-version }}
      beta: ${{ steps.version.outputs.beta }}
    steps:
      - uses: actions/checkout@v7
        with:
          # for the tags
          fetch-depth: 0
      - name: Check the version
        id: version
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
              sh .github/scripts/release-tag.sh "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
              sh .github/scripts/release-tag.sh >> "$GITHUB_OUTPUT"
          fi
      - name: Make the tarball
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          name=path-of-upgrading-${TAG#v}
          git archive --prefix="$name/" -o "$name.tar.gz" HEAD
      - uses: actions/upload-artifact@v7
        with:
          name: dist-source
          path: path-of-upgrading-*.tar.gz
          if-no-files-found: error

  build:
    name: Build
    needs: source
    # The packages come from the build the tests ran on. Without anything to
    # release, a push is only checked.
    uses: ./.github/workflows/ci.yml
    with:
      package: ${{ github.event_name == 'pull_request' || needs.source.outputs.release == 'true' }}
      version: ${{ needs.source.outputs.version }}
      tag: ${{ needs.source.outputs.tag }}
      arch-version: ${{ needs.source.outputs.arch-version }}
      debian-version: ${{ needs.source.outputs.debian-version }}
      beta: ${{ needs.source.outputs.beta == 'true' }}

  release:
    name: Release
    if: needs.source.outputs.release == 'true' && github.event_name == 'push'
    needs: [source, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # for the commits since the last release
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Write the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.source.outputs.tag }}
        run: sh .github/scripts/release-notes.sh "$TAG" "$GITHUB_SHA" > notes.md
      - name: Make the release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.source.outputs.tag }}
          VERSION: ${{ needs.source.outputs.version }}
        run: |
          sha256sum -- * > SHA256SUMS
          if [ "$GITHUB_REF_NAME" = beta ]; then
              n=${TAG##*-beta.}
              set -- --title "Path of Upgrading $VERSION beta $n" --prerelease --latest=false
          else
              set -- --title "Path of Upgrading $VERSION" --latest
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" --notes-file ../notes.md "$@" -- *
