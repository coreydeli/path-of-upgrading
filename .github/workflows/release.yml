# SPDX-License-Identifier: MIT
#
# Each push to main or beta makes a release on GitHub, with the source, an Arch
# Linux package, a Debian 13 package, a Windows installer and zip, and the
# changes since the last one.
# Main releases the version in CMakeLists.txt as the latest release, once. Beta
# releases it as a pre-release, v0.1.0-beta.1 and on, until that version is
# out. The source comes first, then every check CI makes, then the packages,
# then the release, each once the stages before it have passed. Pull requests
# that change how they're made build the packages too, without releasing
# anything.
name: Release

on:
  push:
    branches: [main, beta]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/scripts/**
      - packaging/**

permissions:
  contents: read

# one at a time, so two betas can't take the same number
concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source:
    name: Source
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      release: ${{ steps.version.outputs.release }}
      arch-version: ${{ steps.version.outputs.arch-version }}
      debian-version: ${{ steps.version.outputs.debian-version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # for the tags
          fetch-depth: 0
      - name: Check the version
        id: version
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
              sh .github/scripts/release-tag.sh "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
              sh .github/scripts/release-tag.sh >> "$GITHUB_OUTPUT"
          fi
      - name: Make the tarballs
        env:
          TAG: ${{ steps.version.outputs.tag }}
          ARCH_VERSION: ${{ steps.version.outputs.arch-version }}
        run: |
          name=path-of-upgrading-${TAG#v}
          git archive --prefix="$name/" -o "$name.tar.gz" HEAD
          mkdir arch
          name=path-of-upgrading-$ARCH_VERSION
          git archive --prefix="$name/" -o "arch/$name.tar.gz" HEAD
      - uses: actions/upload-artifact@v7
        with:
          name: dist-source
          path: path-of-upgrading-*.tar.gz
          if-no-files-found: error
      # named as the PKGBUILD has it
      - uses: actions/upload-artifact@v7
        with:
          name: arch-source
          path: arch/path-of-upgrading-*.tar.gz
          if-no-files-found: error

  checks:
    name: Checks
    # a pull request has them from CI already
    if: github.event_name == 'push'
    needs: source
    uses: ./.github/workflows/ci.yml

  arch:
    name: Arch Linux package
    needs: [source, checks]
    # once the checks have passed, or without them on a pull request, and
    # only when there's something to release
    if: >-
      ${{ !cancelled() && !failure()
      && (github.event_name == 'pull_request' || needs.source.outputs.release == 'true') }}
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the build tools and libraries
        run: sh .github/scripts/install-arch.sh
      # where makepkg looks for the PKGBUILD's source before downloading it
      - uses: actions/download-artifact@v8
        with:
          name: arch-source
          path: packaging/arch
      - name: Build and test the package
        working-directory: packaging/arch
        env:
          ARCH_VERSION: ${{ needs.source.outputs.arch-version }}
        # makepkg won't run as root
        run: |
          sed -i "s/^pkgver=.*/pkgver=$ARCH_VERSION/" PKGBUILD
          useradd -m builder
          chown -R builder .
          runuser -u builder -- makepkg
      - uses: actions/upload-artifact@v7
        with:
          name: dist-arch
          # not the debug package
          path: packaging/arch/path-of-upgrading-[0-9]*.pkg.tar.zst
          if-no-files-found: error

  debian:
    name: Debian 13 package
    needs: [source, checks]
    if: >-
      ${{ !cancelled() && !failure()
      && (github.event_name == 'pull_request' || needs.source.outputs.release == 'true') }}
    runs-on: ubuntu-latest
    container: debian:trixie
    env:
      LANG: C.UTF-8
    steps:
      - uses: actions/checkout@v7
      - name: Install the build tools and libraries
        run: sh .github/scripts/install-debian.sh
      - name: Configure
        run: >-
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DPOU_PACKAGE_VERSION=${{ needs.source.outputs.debian-version }}
      - name: Build
        run: cmake --build build
      - name: Test
        working-directory: build
        run: sh ../.github/scripts/run-tests.sh
      - name: Make the package
        working-directory: build
        run: cpack
      # which fails when a package it depends on has the wrong name
      - name: Install the package
        run: |
          apt-get install -y ./build/path-of-upgrading_*.deb
          QT_QPA_PLATFORM=offscreen path-of-upgrading --version
      - uses: actions/upload-artifact@v7
        with:
          name: dist-debian
          path: build/path-of-upgrading_*.deb
          if-no-files-found: error

  windows:
    name: Windows installer and zip
    needs: [source, checks]
    if: >-
      ${{ !cancelled() && !failure()
      && (github.event_name == 'pull_request' || needs.source.outputs.release == 'true') }}
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Keep the line ends
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
      - name: Install the build tools and libraries
        run: sh .github/scripts/install-msys2.sh
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
      - name: Build
        run: cmake --build build
      - name: Make the installer and the zip
        env:
          TAG: ${{ needs.source.outputs.tag }}
          VERSION: ${{ needs.source.outputs.version }}
        run: |
          mkdir dist
          cd dist
          sh ../.github/scripts/package-windows.sh ../build "$VERSION" "${TAG#v}"
      # They aren't signed yet, so Windows warns about them when they're
      # opened. Signing them would go here.
      - uses: actions/upload-artifact@v7
        with:
          name: dist-windows
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

  release:
    name: Release
    if: needs.source.outputs.release == 'true' && github.event_name == 'push'
    needs: [source, checks, arch, debian, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # for the commits since the last release
          fetch-depth: 0
      # not the builds the checks handed on
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Write the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.source.outputs.tag }}
        run: sh .github/scripts/release-notes.sh "$TAG" "$GITHUB_SHA" > notes.md
      - name: Make the release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.source.outputs.tag }}
          VERSION: ${{ needs.source.outputs.version }}
        run: |
          sha256sum -- * > SHA256SUMS
          if [ "$GITHUB_REF_NAME" = beta ]; then
              n=${TAG##*-beta.}
              set -- --title "Path of Upgrading $VERSION beta $n" --prerelease --latest=false
          else
              set -- --title "Path of Upgrading $VERSION" --latest
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" --notes-file ../notes.md "$@" -- *
