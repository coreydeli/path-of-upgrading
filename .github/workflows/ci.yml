# SPDX-License-Identifier: MIT
#
# Checks the format, then builds with no warnings and runs every test, each
# stage once the one before it has passed. It builds on Arch Linux for the
# newest Qt and KDE Frameworks and on Debian 13 for the oldest the app
# supports, on Fedora, and on Windows in MSYS2. Each is built once, as it's released, and
# the packages come from that build when release.yml asks for them. A branch
# is built as a beta on Debian and as a release on the others, as the tests
# have to pass in both. Main and beta are checked by the release builds, which
# run it. A change to nothing but the docs isn't built, except on those.
name: CI

on:
  push:
    branches-ignore: [main, beta]
  pull_request:
  workflow_call:
    inputs:
      package:
        description: Make the packages as well
        type: boolean
        default: false
      version:
        type: string
        default: ""
      tag:
        type: string
        default: ""
      arch-version:
        type: string
        default: ""
      debian-version:
        type: string
        default: ""
      rpm-version:
        type: string
        default: ""
      beta:
        description: Build a beta, which has trade searches on by default
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # every merge to main or beta keeps its own result
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/beta' }}

jobs:
  # A branch of this repository is checked when it's pushed, which a pull
  # request from it shows, so pull requests are only checked from forks, or
  # when the release builds ask for the packages. Format waits on this, and
  # the other stages on Format, so they're left out with it. A change to
  # nothing but the docs is left out too, and shows as skipped.
  changes:
    name: Changes
    if: >-
      github.event_name == 'push' || inputs.package
      || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.code.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          # to find where a branch left beta
          fetch-depth: 0
      - name: Check what changed
        id: code
        env:
          PACKAGE: ${{ inputs.package }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: sh .github/scripts/changed-code.sh >> "$GITHUB_OUTPUT"

  format:
    name: Format
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install clang-format
        run: pacman -Syu --noconfirm --needed clang git
      - uses: actions/checkout@v7
      - name: Check the format
        run: git ls-files -z '*.cpp' '*.h' | xargs -0 clang-format --dry-run -Werror

  # The package is made by makepkg, which builds it from the tarball of the
  # source, tests it and packs it in one go. The libraries aren't cached here
  # or on Debian: the runners download them in seconds, and it's unpacking
  # them that takes the time.
  arch:
    name: Arch Linux
    needs: format
    runs-on: ubuntu-latest
    container: archlinux:latest
    env:
      LANG: C.UTF-8
      CCACHE_DIR: /ccache
      CCACHE_MAXSIZE: 100M
    steps:
      # so the checkout is a repository, which the tarball is made from
      - name: Install git
        run: pacman -Syu --noconfirm --needed git
      - uses: actions/checkout@v7
      - name: Install the build tools and libraries
        run: sh .github/scripts/install-arch.sh
      # where makepkg looks for the PKGBUILD's source before downloading it
      - name: Make the source tarball
        env:
          ARCH_VERSION: ${{ inputs.arch-version }}
        run: |
          pkgver=${ARCH_VERSION:-$(sed -n 's/^pkgver=//p' packaging/arch/PKGBUILD)}
          sed -i "s/^pkgver=.*/pkgver=$pkgver/" packaging/arch/PKGBUILD
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git archive --prefix="path-of-upgrading-${pkgver%%beta*}/" \
              -o "packaging/arch/path-of-upgrading-$pkgver.tar.gz" HEAD
      - uses: actions/cache@v6
        with:
          path: /ccache
          key: ccache-arch-${{ github.sha }}
          restore-keys: ccache-arch-
      # makepkg won't run as root. It compiles with ccache, the debug package
      # isn't released, and a warning fails the build.
      - name: Set up makepkg
        run: |
          useradd -m builder
          mkdir -p /ccache
          chown -R builder packaging/arch /ccache
          cat > /home/builder/.makepkg.conf << 'CONF'
          BUILDENV=("${BUILDENV[@]/!ccache/ccache}")
          OPTIONS+=(!debug)
          CXXFLAGS+=" -Werror"
          CONF
      - name: Build, test and package
        working-directory: packaging/arch
        run: |
          runuser -u builder -- ccache --zero-stats
          runuser -u builder -- makepkg
          runuser -u builder -- ccache --show-stats
      - name: Lint the QML
        working-directory: packaging/arch
        run: runuser -u builder -- cmake --build src/build --target pou_app_qmllint
      - uses: actions/upload-artifact@v7
        if: inputs.package
        with:
          name: dist-arch
          # not the debug package
          path: packaging/arch/path-of-upgrading-[0-9]*.pkg.tar.zst
          if-no-files-found: error

  debian:
    name: Debian 13
    needs: format
    runs-on: ubuntu-latest
    container: debian:trixie
    env:
      LANG: C.UTF-8
      CCACHE_DIR: /ccache
      CCACHE_MAXSIZE: 100M
    steps:
      - uses: actions/checkout@v7
      - name: Install the build tools and libraries
        run: sh .github/scripts/install-debian.sh
      - uses: actions/cache@v6
        with:
          path: /ccache
          key: ccache-debian-${{ github.sha }}
          restore-keys: ccache-debian-
      # Arch and Windows build a release here, so a branch gets a beta on
      # this one, as the tests pass in both or not at all. In the release
      # builds github.workflow is Release, and they say which they are.
      - name: Configure
        env:
          DEBIAN_VERSION: ${{ inputs.debian-version }}
        run: >-
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DPOU_BETA=${{ (inputs.beta || github.workflow == 'CI') && 'ON' || 'OFF' }}
          ${DEBIAN_VERSION:+"-DPOU_PACKAGE_VERSION=$DEBIAN_VERSION"}
      - name: Build
        run: |
          ccache --zero-stats
          cmake --build build
          ccache --show-stats
      - name: Lint the QML
        run: cmake --build build --target pou_app_qmllint
      - name: Test
        working-directory: build
        run: sh ../.github/scripts/run-tests.sh
      - name: Make the package
        if: inputs.package
        working-directory: build
        run: cpack
      # which fails when a package it depends on has the wrong name
      - name: Install the package
        if: inputs.package
        run: |
          apt-get install -y ./build/path-of-upgrading_*.deb
          QT_QPA_PLATFORM=offscreen path-of-upgrading --version
      - uses: actions/upload-artifact@v7
        if: inputs.package
        with:
          name: dist-debian
          path: build/path-of-upgrading_*.deb
          if-no-files-found: error

  # The package is made by rpmbuild, which builds it from the tarball of the
  # source, tests it and packs it in one go, as makepkg does on Arch. LTO is
  # left out as it only slows the build down here, and a warning fails it.
  fedora:
    name: Fedora
    needs: format
    runs-on: ubuntu-latest
    container: fedora:latest
    env:
      LANG: C.UTF-8
      CCACHE_DIR: /ccache
      CCACHE_MAXSIZE: 100M
    steps:
      # so the checkout is a repository, which the tarball is made from
      - name: Install git
        run: dnf -y install git
      - uses: actions/checkout@v7
      - name: Install the build tools and libraries
        run: sh .github/scripts/install-fedora.sh
      - uses: actions/cache@v6
        with:
          path: /ccache
          key: ccache-fedora-${{ github.sha }}
          restore-keys: ccache-fedora-
      # where rpmbuild looks for the source. A beta's tarball unpacks to the
      # release's folder, so the paths stay the same from one beta to the next.
      - name: Make the source tarball
        env:
          RPM_VERSION: ${{ inputs.rpm-version }}
        run: |
          spec=packaging/rpm/path-of-upgrading.spec
          version=${RPM_VERSION:-$(sed -n 's/^Version: *//p' $spec)}
          sed -i -e "s/^Version:.*/Version:        $version/" \
              -e "s/^\(\* .* - \).*-1\$/\1$version-1/" $spec
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p ~/rpmbuild/SOURCES
          git archive --prefix="path-of-upgrading-${version%%~*}/" \
              -o ~/rpmbuild/SOURCES/path-of-upgrading-$version.tar.gz HEAD
      - name: Build, test and package
        env:
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: |
          ccache --zero-stats
          rpmbuild -bb packaging/rpm/path-of-upgrading.spec --with werror \
              -D "build_cxxflags %{optflags} -g1" -D "_lto_cflags %{nil}"
          ccache --show-stats
      - name: Check the package
        run: >-
          rpmlint -r packaging/rpm/path-of-upgrading.rpmlintrc
          ~/rpmbuild/RPMS/x86_64/path-of-upgrading-[0-9]*.rpm packaging/rpm/path-of-upgrading.spec
      # not the debug packages
      - name: Collect the package
        if: inputs.package
        run: |
          mkdir dist
          cp ~/rpmbuild/RPMS/x86_64/path-of-upgrading-[0-9]*.rpm dist
      - uses: actions/upload-artifact@v7
        if: inputs.package
        with:
          name: dist-fedora
          path: dist/*.rpm
          if-no-files-found: error

  # In a container with nothing else, to see that dnf finds everything the
  # package needs, and that the program starts with it. It runs until the
  # timeout, unless a QML module is missing, which stops it at once.
  fedora-install:
    name: Install on Fedora
    if: inputs.package
    needs: fedora
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist-fedora
          path: dist
      - name: Install the package
        run: dnf -y install ./dist/path-of-upgrading-*.rpm dbus-daemon
      - name: Start it
        env:
          QT_QPA_PLATFORM: offscreen
          QT_NO_XDG_DESKTOP_PORTAL: "1"
          XDG_RUNTIME_DIR: /tmp/runtime
        run: |
          mkdir -m 700 "$XDG_RUNTIME_DIR"
          path-of-upgrading --version
          status=0
          timeout 10 dbus-run-session -- path-of-upgrading || status=$?
          test "$status" -eq 124

  windows:
    name: Windows
    needs: format
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 100M
    steps:
      # the test files as they are in the repository, not with Windows' line ends
      - name: Keep the line ends
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
      # The download is the slowest part of installing here, so the packages
      # are kept for the week, and a new week takes the old ones and updates
      # them. setup-msys2 empties its package folder after its own cache, so
      # this one is the install's.
      - name: Find the week
        id: week
        shell: bash
        run: echo "week=$(date +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/msys64/var/cache/pacman/pkg
          key: msys2-packages-${{ hashFiles('.github/scripts/install-msys2.sh') }}-${{ steps.week.outputs.week }}
          restore-keys: |
            msys2-packages-${{ hashFiles('.github/scripts/install-msys2.sh') }}-
            msys2-packages-
      - name: Install the build tools and libraries
        run: sh .github/scripts/install-msys2.sh
      # so a new week's cache doesn't keep last week's versions as well
      - name: Drop the old package versions
        run: paccache -r -f -k1
      - uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-windows-${{ github.sha }}
          restore-keys: ccache-windows-
      - name: Configure
        run: >-
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_COMPILE_WARNING_AS_ERROR=ON -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DPOU_BETA=${{ inputs.beta && 'ON' || 'OFF' }}
      # going on past an error, so each run shows them all
      - name: Build
        run: |
          ccache --zero-stats
          cmake --build build -- -k 0
          ccache --show-stats
      - name: Test
        working-directory: build
        env:
          QT_QPA_PLATFORM: offscreen
        # ctest shows nothing of what a failed test said here, so they run
        # again with their logs in files
        run: |
          ctest --output-on-failure -j4 && exit 0
          # in the folder ctest runs them in, from the top of the build folder,
          # where qt_standard_project_setup puts the programs on Windows
          cd tests
          for name in $(sed 's/^[0-9]*://' ../Testing/Temporary/LastTestsFailed.log); do
              echo "::group::$name"
              ../$name.exe -o "$name.txt,txt" || echo "It ended with $?"
              cat "$name.txt" || true
              echo "::endgroup::"
          done
          exit 1
      - name: Make the installer and the zip
        if: inputs.package
        env:
          TAG: ${{ inputs.tag }}
          VERSION: ${{ inputs.version }}
        run: |
          mkdir dist
          cd dist
          sh ../.github/scripts/package-windows.sh ../build "$VERSION" "${TAG#v}"
      # They aren't signed yet, so Windows warns about them when they're
      # opened. Signing them would go here.
      - uses: actions/upload-artifact@v7
        if: inputs.package
        with:
          name: dist-windows
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

  # The rule on beta waits for a check called CI, so this is it. It passes
  # once every stage has passed or been left out, as they are for the docs.
  ci:
    name: CI
    needs: [changes, format, arch, debian, fedora, fedora-install, windows]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check every stage passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          case " $RESULTS " in
          *" failure "* | *" cancelled "*) exit 1 ;;
          esac
