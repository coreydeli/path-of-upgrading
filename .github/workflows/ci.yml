# SPDX-License-Identifier: MIT
#
# Checks the format, then builds with no warnings, then runs every test, each
# stage once the one before it has passed. It builds on Arch Linux for the
# newest Qt and KDE Frameworks and on Debian 13 for the oldest the app
# supports, and on Windows in MSYS2. Main and beta are checked by the release
# builds, which run it.
name: CI

on:
  push:
    branches-ignore: [main, beta]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # every merge to main or beta keeps its own result
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/beta' }}

jobs:
  format:
    name: Format
    # A branch of this repository is checked when it's pushed, which a pull
    # request from it shows, so pull requests are only checked from forks.
    # The other stages wait on this one, so they're left out with it.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install clang-format
        run: pacman -Syu --noconfirm --needed clang git
      - uses: actions/checkout@v7
      - name: Check the format
        run: git ls-files -z '*.cpp' '*.h' | xargs -0 clang-format --dry-run -Werror

  build:
    name: Build on ${{ matrix.name }}
    needs: format
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Arch Linux
            image: archlinux:latest
            distro: arch
          - name: Debian 13
            image: debian:trixie
            distro: debian
    env:
      LANG: C.UTF-8
    steps:
      - uses: actions/checkout@v7
      - name: Install the build tools and libraries
        run: sh .github/scripts/install-${{ matrix.distro }}.sh
      # with no debug info, which would make the build too big to hand on
      - name: Configure
        run: >-
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS_DEBUG=-g0
          -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
      - name: Build
        run: cmake --build build
      - name: Lint the QML
        run: cmake --build build --target pou_app_qmllint
      # in a tarball, which keeps the programs runnable, and without what was
      # only needed to link them
      - name: Pack the build
        run: tar -cf build.tar --exclude='*.o' --exclude='*.a' build
      - uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.distro }}
          path: build.tar
          if-no-files-found: error
          retention-days: 1

  test:
    name: Test on ${{ matrix.name }}
    needs: build
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Arch Linux
            image: archlinux:latest
            distro: arch
          - name: Debian 13
            image: debian:trixie
            distro: debian
    env:
      LANG: C.UTF-8
    steps:
      # in the same folder as the build, which the tests find their files by
      - uses: actions/checkout@v7
      - name: Install the build tools and libraries
        run: sh .github/scripts/install-${{ matrix.distro }}.sh
      - uses: actions/download-artifact@v8
        with:
          name: build-${{ matrix.distro }}
      - name: Unpack the build
        run: tar -xf build.tar
      - name: Test
        working-directory: build
        run: sh ../.github/scripts/run-tests.sh

  windows:
    name: Build and test on Windows
    needs: format
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      # the test files as they are in the repository, not with Windows' line ends
      - name: Keep the line ends
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
      - name: Install the build tools and libraries
        run: sh .github/scripts/install-msys2.sh
      - name: Configure
        run: >-
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS_DEBUG=-g0
          -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
      # going on past an error, so each run shows them all
      - name: Build
        run: cmake --build build -- -k 0
      - name: Test
        working-directory: build
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --output-on-failure -j4
