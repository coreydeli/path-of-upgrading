# How GitHub groups the pull requests in a release's notes, by their labels.
# A pull request goes under the first group it matches.
changelog:
  categories:
    - title: Features
      labels:
        - enhancement
    - title: Fixes
      labels:
        - bug
    - title: Documentation
      labels:
        - documentation
    - title: CI
      labels:
        - ci
    - title: Maintenance
      labels:
        - maintenance
    - title: Other changes
      labels:
        - "*"
