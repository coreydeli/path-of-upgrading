# Settings for the site, which build.py copies to site/.work and fills the nav in.
[project]
site_name = "Path of Upgrading"
site_description = "An item overlay for Path of Exile 2 on Linux. Download it and read the docs."
site_url = "https://coreydeli.github.io/path-of-upgrading/"
# No repo_url: the header would ask GitHub for the stars and releases from every visitor's browser.
copyright = "MIT licensed. Path of Exile is a trademark of Grinding Gear Games. This project isn't affiliated with or endorsed by them."
docs_dir = "content"
site_dir = "site"
extra_css = ["assets/site.css"]
nav = []  # build.py puts the pages here

[project.theme]
language = "en"
# The fonts come with the site, so nothing is asked of Google.
font = false
logo = "assets/icon.svg"
favicon = "assets/icon.svg"
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.instant",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
scheme = "slate"
primary = "custom"
accent = "custom"

[project.extra]
# no analytics, and nothing else that phones home
generator = false

[project.markdown_extensions]
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.highlight = {}
pymdownx.superfences = {}
